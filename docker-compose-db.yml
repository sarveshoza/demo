version: '3.8'
services:
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Manager@123
    volumes:
      - mssql-data:/var/opt/mssql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

volumes:
  mssql-data: