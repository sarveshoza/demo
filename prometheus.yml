scrape_configs:
  - job_name: 'demo-application'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s # This can be adjusted based on our needs
    static_configs:
      - targets: ['localhost:8080']
  - job_name: 'spring-boot-app'
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
     - targets: [ '127.0.0.1:52148' ]