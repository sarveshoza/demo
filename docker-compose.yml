version: '3.8'
services:
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Manager@123
    volumes:
      - mssql-data:/var/opt/mssql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

  spring-hello:
    image: sarvesh10/spring-hello
    depends_on:
      - mssql-db
    environment:
      - DB_HOST=mssql-db
      - DB_PORT=1433
      - DB_USERNAME=sa
      - DB_PASSWORD=Manager@123
    ports:
      - "8080:8080"

volumes:
  mssql-data: